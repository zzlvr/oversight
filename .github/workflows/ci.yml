name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test core package
        working-directory: Packages/OversightCore
        run: swift test

  build:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: |
          curl -fsSLo xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          rm xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        run: xcodegen
      - name: Build unsigned app
        run: |
          xcodebuild -project Oversight.xcodeproj -scheme Oversight \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Oversight.app Payload/
          zip -qr Oversight.ipa Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Oversight-unsigned-ipa
          path: Oversight.ipa
